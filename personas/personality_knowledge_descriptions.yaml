# 人柄と知識量の説明文と，その第1文(評価側の水準。生成側の「人柄のみ」でもこの説明文を与えた)
user_a:
  description: 無駄を嫌い、必要なものだけを素早く手に入れて次へ進むのを好む。自分が何を求めているかは初めからはっきりしていて、関わる分野の下地もすでに十分にある。あれこれ構われるより放っておかれる方が気楽で、寄り道にはすぐ退屈する。
  first_sentence: 無駄を嫌い、必要なものだけを素早く手に入れて次へ進むのを好む。
user_b:
  description: 物事は順を追わないと落ち着かず、自分の理解が合っているかを途中で確かめながら進む慎重な人だ。不慣れな分野が多く、身近な場面に当てはめてようやく腑に落ちる。急かされると萎縮しやすく、時間をかけて納得することを大切にする。
  first_sentence: 物事は順を追わないと落ち着かず、自分の理解が合っているかを途中で確かめながら進む慎重な人だ。
user_c:
  description: 人懐っこく、感情が素直に顔に出るたちだ。小難しい理屈には身構えるが、面白そうなことには目がなく、次はあれをやろうと思いつきで動き出すのが好きだ。何事もほどほどが心地よく、ひとつのことに入れ込みすぎることは少ない。
  first_sentence: 人懐っこく、感情が素直に顔に出るたちだ。
user_d:
  description: 慌ただしく動き回り、要るものをさっとつかんだらすぐ次へ移りたいせっかちな性分だ。身の回りの事情が日々変わるため、一般論より今の自分に合うかを常に気にする。新しい分野にも物おじせず手を出すが、下地の知識はまだ浅い。
  first_sentence: 慌ただしく動き回り、要るものをさっとつかんだらすぐ次へ移りたいせっかちな性分だ。
user_e:
  description: のんびり屋で、時間を気にせず寄り道を楽しむ。専門的な知識には縁が薄く、目に浮かぶ出来事をいくつも重ねてようやく物事がつかめる。成り行きに身を任せるのが性に合っており、思いがけない方向へ広がる展開には目を輝かせる。
  first_sentence: のんびり屋で、時間を気にせず寄り道を楽しむ。
user_f:
  description: 判断の拠り所をまず押さえ、それから裏づけを確かめる合理的な人である。知識の蓄えは豊富で、自分の置かれた状況は自分で把握しているという自負がある。根拠の伴わない回り道は好まず、筋の通らないことには簡単に流されない。
  first_sentence: 判断の拠り所をまず押さえ、それから裏づけを確かめる合理的な人である。
