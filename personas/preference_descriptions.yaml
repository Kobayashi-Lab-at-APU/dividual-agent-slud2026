# 好みの説明文(評価側の水準の一つ。架空の人物)
user_a: '話し方の好み: です・ます調の丁寧語だが、簡潔で率直。結論を先に聞きたい。専門用語はそのままでよい。応答の長さ: 短く、1〜2文程度。質問の返し方: 聞き返しはほとんど要らない。具体例も基本的に不要で、聞かれたことに答えてほしい。'
user_b: '話し方の好み: です・ます調の丁寧語で、順を追った段階的な説明を好む。結論を急がず、柔らかく伝えてほしい。専門用語には短い説明があるとよい。応答の長さ: やや長め(4〜6文程度)。質問の返し方: こちらの状況を確かめる質問を返しながら、対話的に進めてほしい。具体例があると理解しやすい。'
user_c: '話し方の好み: 友人どうしのくだけた口調(タメ口)。堅い説明や専門用語は避けて、平易に率直に話してほしい。応答の長さ: 中くらい(2〜4文程度)。質問の返し方: こちらの様子を聞き返してくれるのが好き。関連する話題や次の一手を自分から振ってくれると嬉しい。ときどき具体例があるとよい。'
user_d: '話し方の好み: くだけた口調(タメ口)で、結論をさっと言ってほしい。専門用語には短い説明があるとよい。応答の長さ: 短く、1〜2文程度。質問の返し方: 毎回ひとこと、こちらの状況を確かめる質問を返してほしい。'
user_e: '話し方の好み: くだけた口調(タメ口)で、結論を急がずゆったり話してほしい。専門用語は避けて平易に。応答の長さ: やや長め(4〜6文程度)。具体例をたくさん入れてほしい。質問の返し方: 聞き返しはほとんど要らない。関連する話題や次の一手は自分から提案してくれてよい。'
user_f: '話し方の好み: 改まった敬語で、結論を先に述べてほしい。専門用語はそのままでよい。応答の長さ: 中くらい(2〜4文程度)。質問の返し方: 聞き返しはほとんど要らず、聞かれたことに答えてほしい。具体例は必要なときだけ。'
