# 台本18本(各3ターン)。全人物で同じ利用者発話を用いた(架空の相談)
scenarios:
- scenario_id: n01_room_hunting
  title: 引っ越し先の部屋選び
  user_turns:
  - 引っ越し先を探していて、候補が2つに絞れました。どちらにするか迷っています。
  - 1つは駅から近いけれど部屋が狭く、もう1つは広いけれど駅から歩いて20分かかります。
  - 決める前に、ほかに確認しておいたほうがいいことはありますか?
- scenario_id: n02_fridge
  title: 冷蔵庫の買い替え
  user_turns:
  - 冷蔵庫が古くなってきたので、買い替えを考えています。
  - 二人暮らしなのですが、容量はどのくらいを選ぶのがよいですか?
  - 省エネ性能と値段だと、どちらを優先するべきですか?
- scenario_id: n03_birthday_gift
  title: 誕生日プレゼント選び
  user_turns:
  - 来週、知り合いの誕生日があって、プレゼントを探しています。
  - 相手はお茶が好きらしいのですが、それ以外はあまりよく知りません。
  - 予算は三千円くらいです。渡すときに気をつけることはありますか?
- scenario_id: n04_meeting_notes
  title: 議事録の取り方
  user_turns:
  - 今度の会議で議事録を担当することになりました。
  - 発言を全部書こうとすると追いつかないのですが、どうまとめればいいですか?
  - 会議のあと、いつまでに共有するのが適切ですか?
- scenario_id: n05_request_email
  title: 依頼メールの書き方
  user_turns:
  - あまり面識のない方に、資料を見せてもらえないかお願いするメールを書こうとしています。
  - 最初のあいさつと、お願いの内容はどういう順番で書けばいいですか?
  - 返信がなかった場合、どのくらい待ってから連絡し直すのが適切ですか?
- scenario_id: n06_houseplant
  title: 観葉植物の水やり
  user_turns:
  - 部屋に置いている観葉植物の葉が、少し黄色くなってきました。
  - 水は毎日少しずつあげているのですが、それがよくないのでしょうか。
  - 置き場所も変えるべきですか?
- scenario_id: n07_spreadsheet
  title: 表計算の関数
  user_turns:
  - 表計算ソフトで、別のシートにある表から商品の値段を自動で引いてきたいです。
  - 商品コードで探せばいいと思うのですが、どの関数を使えばいいですか?
  - 見つからなかったときにエラーではなく空欄にしたいのですが、できますか?
- scenario_id: n08_volunteer
  title: 地域のボランティア
  user_turns:
  - 地域の清掃ボランティアに誘われて、参加しようか考えています。
  - 月に一回、土曜の朝に二時間ほどだそうです。
  - 初めて参加するときに、準備しておくものはありますか?
- scenario_id: n09_phone_photos
  title: スマホの写真整理
  user_turns:
  - スマートフォンの写真が一万枚を超えてしまって、整理したいと思っています。
  - まず何から始めるのがよいですか?
  - 残しておきたい写真のバックアップは、どうするのが安心ですか?
- scenario_id: n10_online_course
  title: オンライン講座の選び方
  user_turns:
  - 統計の基礎を学びたくて、オンライン講座を探しています。
  - 無料のものと有料のものがありますが、違いはどこにあるのでしょうか。
  - 途中で挫折しないために、何かできることはありますか?
- scenario_id: n11_summarizing
  title: 文章の要約のコツ
  user_turns:
  - 長い報告書を読んで、その内容を三行くらいにまとめる必要があります。
  - 大事なところを選ぶ基準がよく分からないのですが、どう考えればいいですか?
  - まとめたものを読み返すときに、何をチェックするのがよいですか?
- scenario_id: n12_task_sharing
  title: チームのタスク分担
  user_turns:
  - 四人のチームで作業を分担することになったのですが、どう決めるか悩んでいます。
  - 得意なことで分けるか、やりたいことで分けるか、どちらがよいと思いますか?
  - 作業の進み具合は、どのくらいの頻度で確認し合えばいいですか?
- scenario_id: n13_password
  title: パスワードの管理
  user_turns:
  - いろいろなサービスのパスワードが増えて、管理しきれなくなってきました。
  - 同じパスワードを使い回すのはやはりよくないのでしょうか。
  - 覚えておく方法と、どこかに保存する方法では、どちらがいいですか?
- scenario_id: n14_tidying
  title: 部屋の片付け
  user_turns:
  - 部屋に物が増えてきたので、週末に片付けをしようと思っています。
  - 捨てるかどうか迷う物が多いのですが、どう判断するのがよいですか?
  - 片付けたあと、散らからない状態を保つコツはありますか?
- scenario_id: n15_museum
  title: 美術館めぐりの計画
  user_turns:
  - 今度の休みに、美術館を二つ回ろうと計画しています。
  - 一日で二つ回るのは、時間的に無理がありますか?
  - 展示をじっくり見るために、事前にしておくといいことはありますか?
- scenario_id: n16_instrument
  title: 楽器を始める
  user_turns:
  - 大人になってから、ギターを始めてみたいと思っています。
  - 独学と教室に通うのでは、どちらがよいと思いますか?
  - 最初の一か月は、どのくらい練習するのがよいですか?
- scenario_id: n17_schedule
  title: 予定の管理
  user_turns:
  - 予定をつい忘れてしまうことがあって、管理の仕方を見直したいです。
  - 紙の手帳とスマートフォンのカレンダーでは、どちらが合うと思いますか?
  - 予定を入れすぎないようにするコツはありますか?
- scenario_id: n18_family_dinner
  title: 家族の食事会の店選び
  user_turns:
  - 来月、家族で集まって食事をすることになり、お店を探しています。
  - 小さい子どもから年配の人まで八人くらい集まります。
  - 予約するときに、お店に伝えておいたほうがいいことはありますか?
