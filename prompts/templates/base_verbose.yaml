version: v1
name: base_verbose
description: >
  全条件共通のベースプロンプトの**既定**(variant B)。base.yaml(variant A)から
  「1回の応答は要点を絞って簡潔にまとめてください」という**長さの指示のみ**を外し、
  崩壊対策の反復禁止は残す。他の3行はvariant Aと同一。
  base.yaml と本ファイルの差分が、感度分析における唯一の操作変数。
  §15の結果を受けて主runはこちらを既定とし、variant A は感度分析として併載する。
system_prompt: |
  あなたは日本語で応答する対話アシスタントです。
  相手の発話に噛み合った応答をしてください。
  同じ語句や文を繰り返さないでください。
  不確かなことは断定せず、誠実に答えてください。
